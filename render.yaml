services:
  # Backend Web Service
  - type: web
    name: digiplus-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_NAME
        value: digiplus_task_manager

  # Frontend Static Site
  - type: web
    name: digiplus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://digiplus-l4m7.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

